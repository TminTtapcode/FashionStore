spring:
  datasource:
    url: jdbc:mysql://localhost:3307/fashion_store_test?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: fashion_user
    password: fashion_password
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        default_batch_fetch_size: 25
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration

logging:
  level:
    root: WARN
    com.fashionstore: INFO

